<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="フラッシュ速読">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>フラッシュ速読</title>
</head>
<body>

<!-- 本棚 -->
<section id="library" class="screen">
  <header class="bar">
    <h1 class="app-title">フラッシュ速読</h1>
  </header>
  <main class="lib-main">
    <ul id="book-list" class="book-list"></ul>
    <p id="empty-msg" class="empty" hidden>本がありません。<br>下のボタンから追加してください。</p>
    <p id="install-note" class="note" hidden>Safari の共有ボタン →「ホーム画面に追加」から使ってください。ブラウザのまま使うと、しばらく開かないうちにデータが消えることがあります。</p>
  </main>
  <footer class="lib-actions">
    <label class="btn">
      ファイルから追加
      <input type="file" id="file-input" class="visually-hidden" accept=".txt,.md,text/plain">
    </label>
    <button type="button" class="btn" id="paste-btn">貼り付けで追加</button>
    <button type="button" class="btn ghost" id="sample-btn">サンプルを追加</button>
  </footer>
</section>

<!-- リーダー -->
<section id="reader" class="screen" hidden>
  <header class="bar">
    <button type="button" id="back-btn" class="icon-btn" aria-label="本棚へ戻る">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" id="title-btn" class="title-btn" aria-label="目次">
      <span id="book-title" class="book-title"></span>
      <span id="chapter-title" class="chapter-title"></span>
    </button>
    <button type="button" id="settings-btn" class="icon-btn" aria-label="設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <main id="stage">
    <div id="frame">
      <span class="guide guide-a"></span>
      <div id="word"></div>
      <span class="guide guide-b"></span>
    </div>
    <p id="hint" class="hint">タップで再生・停止　左右スワイプで1文節移動　長押しで前後の文</p>
  </main>

  <footer class="controls">
    <input type="range" id="seek" class="seek" min="0" max="0" value="0" aria-label="位置">
    <div class="stats">
      <span id="pos-text"></span>
      <span id="remain-text"></span>
    </div>
    <div class="buttons">
      <button type="button" id="prev-para" class="icon-btn" aria-label="段落の先頭へ">
        <svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg>
      </button>
      <button type="button" id="prev" class="icon-btn" aria-label="1つ戻る">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" id="play" class="play-btn" aria-label="再生">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      </button>
      <button type="button" id="next" class="icon-btn" aria-label="1つ進む">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button type="button" id="next-para" class="icon-btn" aria-label="次の段落へ">
        <svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg>
      </button>
    </div>
    <div class="speed-row">
      <span class="label">速度</span>
      <input type="range" id="speed" data-setting="cpm" min="200" max="4000" step="100" aria-label="速度">
      <span class="value"><output data-out="cpm"></output>字/分</span>
    </div>
  </footer>
</section>

<!-- シート類 -->
<div id="backdrop" class="backdrop" hidden></div>

<section id="settings-sheet" class="sheet" hidden aria-label="設定">
  <div class="sheet-head"><h2>設定</h2><button type="button" class="text-btn" data-close>閉じる</button></div>
  <div class="form">
    <label class="row"><span>まとめる</span>
      <select data-setting="group">
        <option value="1">1文節ずつ</option>
        <option value="2">2文節ずつ</option>
        <option value="3">3文節ずつ</option>
      </select>
    </label>
    <label class="row"><span>最小字数</span>
      <select data-setting="minChars">
        <option value="0">なし</option>
        <option value="2">2字以上</option>
        <option value="3">3字以上</option>
        <option value="4">4字以上</option>
        <option value="5">5字以上</option>
      </select>
    </label>
    <label class="row"><span>文字サイズ</span>
      <input type="range" data-setting="fontSize" min="24" max="96" step="2">
      <span class="value"><output data-out="fontSize"></output>px</span>
    </label>
    <label class="row"><span>句読点で間をとる</span><input type="checkbox" data-setting="punctPause"></label>
    <label class="row"><span>重要語を強調</span><input type="checkbox" data-setting="emphHighlight"></label>
    <label class="row"><span>重要語で少し長く</span><input type="checkbox" data-setting="emphSlow"></label>
    <label class="row"><span>縦書き表示</span><input type="checkbox" data-setting="vertical"></label>
    <label class="row"><span>注視点ガイド</span><input type="checkbox" data-setting="guide"></label>
    <label class="row"><span>テーマ</span>
      <select data-setting="theme" data-type="string">
        <option value="auto">端末に合わせる</option>
        <option value="light">ライト</option>
        <option value="dark">ダーク</option>
      </select>
    </label>
  </div>
</section>

<section id="chapter-sheet" class="sheet" hidden aria-label="目次">
  <div class="sheet-head"><h2>目次</h2><button type="button" class="text-btn" data-close>閉じる</button></div>
  <ul id="chapter-list" class="chapter-list"></ul>
</section>

<section id="context-sheet" class="sheet" hidden aria-label="前後の文">
  <div class="sheet-head"><h2>前後の文</h2><button type="button" class="text-btn" data-close>閉じる</button></div>
  <div id="context-body" class="context-body"></div>
  <p class="note">語をタップするとその位置へ移動します</p>
</section>

<section id="paste-sheet" class="sheet" hidden aria-label="貼り付けで追加">
  <div class="sheet-head"><h2>貼り付けで追加</h2><button type="button" class="text-btn" data-close>閉じる</button></div>
  <div class="form">
    <input type="text" id="paste-title" placeholder="タイトル（空なら本文1行目の # 見出し）">
    <textarea id="paste-text" rows="10" placeholder="本文を貼り付け&#10;## 見出し　【重要語】 が使えます"></textarea>
    <button type="button" class="btn" id="paste-save">追加する</button>
  </div>
</section>

<script type="module" src="js/app.js"></script>
</body>
</html>
